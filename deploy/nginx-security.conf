# NDCConnect web app security headers (spec 14 §4.9). Generated by `npm run headers -- --write`; include in the server block.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://clerk.ndcconnect.example https://challenges.cloudflare.com; connect-src 'self' https://api.ndcconnect.example https://clerk.ndcconnect.example; img-src 'self' data: blob: https://api.ndcconnect.example https://img.clerk.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
